<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="dois">Criar Conta</h1>
    </header>
    <nav>
        <a href="../login/login.html">ja possui uma conta?</a>
    </nav>
    <main class="dd">
        <form action="../login/login.html" class="cadastro">
            <h3>da seus dados</h3>

            <label for="nome" class="rr">
                nome:
                <input type="text" required placeholder="me diga o seu nome: theo" id="theo">

            </label>
            <label for="email" class="rr">
                email:
                <input type="email" required placeholder="me diga o seu email: theo theo" id="theo theo" maxlength="100">
            </label>
            <label for="password" class="rr"> senha:
                <input type="password" required placeholder="me diga sua senha (MINIMO 67)" id="six seven" maxlength="20">
            </label>

            <label for="password" class="rr">sua senha:
            <input type="password" required placeholder="me diga a sua senha"></label>
            <label for="CPF" class="rr">
                Documento:
                <input type="text" required placeholder="Informe seu RG/CPF" id="CPF" minlength="11" maxlength="11">
            </label>
            
            
            <label for="endereço" class="rr">
                Endereço:
                <input type="text" required placeholder="Informe seu endereço" id="endereço" minlength="50">
            </label>

            <label for="cidade" class="rr">
                Cidade:
                <input type="text" required placeholder="Informe sua cidade" id="cidade" maxlength="70">
            </label>
            
            
            <label for="estado" class="rr">
                Estado:
                <input type="text" required placeholder="Informe o Estado" id="estado" minlength="2">
            </label>
            
            
            <label for="país" class="rr">
                País:
                <input type="text" required placeholder="Informe o país de origem" id="país" minlength="10">
            </label>
            
            
            <label for="date" class="rr">
                Data de nascimento:
                <input type="date">
            </label>
            
            
            <button>Finalizar Cadastro</button>
        </form>
    </main>
</body>
</html>
